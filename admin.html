<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيدليتي — إدارة الاشتراكات</title>
<meta name="theme-color" content="#12233a">
<meta name="robots" content="noindex">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<main id="gate" class="gate">
  <div class="brand"><img src="./icons/icon.svg" alt="" width="56" height="56"><h1>إدارة الاشتراكات</h1><p>صيدليتي</p></div>
  <section id="auth" class="card authcard"><p class="note">لحظة…</p></section>
</main>

<div id="app" class="wrap" hidden>
  <header class="top">
    <div><h1>الصيدليات المشتركة</h1><p class="muted" id="who"></p></div>
    <div class="src"><a class="btn" href="./index.html">لوحة صيدليتي</a></div>
  </header>

  <section class="tiles" id="tiles" aria-label="ملخص"></section>

  <details class="help" open>
    <summary>الأسعار وطريقة الدفع</summary>
    <form id="cfgForm" class="stack">
      <div class="grid2">
        <label>أيام التجربة المجانية لأي صيدلية جديدة<input id="cTrial" type="number" min="0" max="365" required></label>
        <label>أيام السماح بعد ما الاشتراك يخلص (قبل ما اللوحة تتقفل)<input id="cGrace" type="number" min="0" max="60" required></label>
        <label>سعر الشهر (فرع واحد)<input id="cPrice" type="number" min="0" step="1" required></label>
        <label>زيادة لكل فرع زيادة<input id="cBranch" type="number" min="0" step="1" required></label>
        <label>رقم الدعم (واتساب)<input id="cPhone" type="tel" maxlength="30" placeholder="01xxxxxxxxx"></label>
      </div>
      <label>طريقة الدفع (بتظهر للصيدلية)<textarea id="cPay" maxlength="600" placeholder="حوّل على إنستاباي: name@instapay أو فودافون كاش 01xxxxxxxxx، وابعت صورة التحويل على واتساب."></textarea></label>
      <div class="row"><button class="btn primary" type="submit">احفظ</button><span class="note" id="cfgMsg" role="status"></span></div>
    </form>
  </details>

  <div class="row" style="margin:12px 0"><input id="q" type="search" placeholder="دوّر باسم الصيدلية أو الإيميل…" style="flex:1" aria-label="بحث">
    <label>الحالة<select id="fStatus"><option value="">الكل</option><option value="trial">تجربة</option><option value="active">مدفوع</option><option value="due">خلص / قرب يخلص</option><option value="free">مجاني</option><option value="suspended">موقوف</option></select></label></div>
  <div class="tablebox"><table>
    <thead><tr><th>الصيدلية</th><th>صاحبها</th><th>الحالة</th><th>لحد</th><th>نشاط آخر 30 يوم</th><th>السعر</th><th></th></tr></thead>
    <tbody id="list"></tbody>
  </table></div>
  <p class="note" id="msg" role="status"></p>

  <details class="help">
    <summary>أخطاء ظهرت عند المستخدمين</summary>
    <p class="note">أي خطأ بيحصل في شاشات البرنامج عند أي صيدلية بيتسجل هنا، عشان تعرفه قبل ما حد يشتكي.</p>
    <div class="tablebox"><table><thead><tr><th>إمتى</th><th>الصفحة</th><th>الخطأ</th><th>النسخة</th></tr></thead><tbody id="errors"></tbody></table></div>
  </details>
</div>

<dialog id="editDlg" class="card">
  <form id="editForm" class="stack" novalidate>
    <h3 id="eName"></h3>
    <label>الحالة<select id="eStatus"><option value="trial">تجربة</option><option value="active">مدفوع</option><option value="free">مجاني (من غير اشتراك)</option><option value="suspended">موقوف</option></select></label>
    <label id="eTrialWrap">التجربة لحد<input id="eTrial" type="date"></label>
    <label id="ePaidWrap">مدفوع لحد<input id="ePaid" type="date"></label>
    <div class="row" id="eAdd"><span class="muted">زوّد:</span><button class="btn" type="button" data-add="1">شهر</button><button class="btn" type="button" data-add="3">3 شهور</button><button class="btn" type="button" data-add="6">6 شهور</button><button class="btn" type="button" data-add="12">سنة</button></div>
    <label>سعر خاص للصيدلية دي في الشهر (فاضي = السعر العادي)<input id="ePrice" type="number" min="0" step="1"></label>
    <label>ملاحظة (مثلاً: دفع 500 إنستاباي يوم 28/10)<textarea id="eNote" maxlength="600"></textarea></label>
    <div class="row"><button class="btn primary" type="submit">احفظ</button><button class="btn" type="button" id="eCancel">إلغاء</button><span class="note" id="eMsg" role="status"></span></div>
  </form>
</dialog>

<script type="module" src="./src/admin.js"></script>
</body>
</html>
