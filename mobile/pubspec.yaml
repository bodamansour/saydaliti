name: saydaliti_app
description: صيدليتي — Android app for the pharmacy dashboard.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# Official Flutter-team plugins only, so builds keep working with new Flutter/Android releases.
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: any
  webview_flutter_android: any
  file_selector: any
  url_launcher: any

dev_dependencies:
  flutter_launcher_icons: any

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon-512.png
  adaptive_icon_background: '#0b6b57'
  adaptive_icon_foreground: assets/icon-foreground.png
  min_sdk_android: 21
