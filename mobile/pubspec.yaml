name: saydaliti_app
description: صيدليتي — the pharmacy owner's app (stock, orders, money), native Android.
publish_to: none
version: 2.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

# Official Flutter- and Dart-team packages only, so builds keep working with new Flutter/Android releases.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: any
  intl: any
  collection: any
  shared_preferences: any
  url_launcher: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  fonts:
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/ReadexPro_400Regular.ttf
        - asset: assets/fonts/ReadexPro_500Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro_600SemiBold.ttf
          weight: 700
    - family: Noto Kufi Arabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic_700Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon-512.png
  adaptive_icon_background: '#0b3b2e'
  adaptive_icon_foreground: assets/icon-foreground.png
  min_sdk_android: 21
