# صيدليتي on Cloudflare. Deployed by .github/workflows/cloudflare.yml (needs the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID). Secrets for the WhatsApp jobs and the PIN pepper
# are set in the Cloudflare dashboard (Worker → Settings → Variables), never here.
name = "saydaliti"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "none"
run_worker_first = ["/api/*", "/rest/*"]

[[d1_databases]]
binding = "DB"
database_name = "saydaliti"
database_id = "3cf7edd2-1642-428b-bf1b-973f71d93529"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "saydaliti-files"

[vars]
MORNING_CRON = "0 6 * * *"
# 01:30 UTC = 03:30 Cairo: the daily encrypted backups (worker/src/backup.js; needs the BACKUP_KEY secret).
BACKUP_CRON = "30 1 * * *"
# Password hashing strength: 10000 fits the free Workers plan; raise to 100000 on Workers Paid
# (each account is redone at its next sign-in).
PBKDF2_ITER = "10000"
SITE_URL = "https://saydaliti.saydalitiapp.workers.dev"
# Hourly sealing and owner verification limits; measure CPU and R2 history inventory on staging before changing them.
SEAL_BUDGET = "150"
VERIFY_MAX_ROWS = "200"

[triggers]
# 06:00 UTC = 09:00 Cairo: morning report. Every hour at :15: patient reminders. 01:30 UTC: backups.
crons = ["0 6 * * *", "15 * * * *", "30 1 * * *"]

[observability]
enabled = true

# ---------- STAGING (isolated; synthetic data only) ----------
# Its own Worker, D1 database and R2 bucket — never the production ones above. Deployed only by
# .github/workflows/staging.yml with the staging-only token; test/staging-isolation.test.js fails if
# any staging binding points at a production resource.
[env.staging]
name = "saydaliti-staging"
workers_dev = true

[env.staging.vars]
# Marks this Worker as staging: worker/src/egress.js then strips every outside-service credential (WhatsApp,
# AI) and refuses outbound requests from the scheduled jobs, so staging can never message a real patient.
DEPLOY_ENV = "staging"
MORNING_CRON = "0 6 * * *"
# Backups every 30 minutes on staging, so the schedule can be observed (production: daily at 01:30 UTC).
BACKUP_CRON = "*/30 * * * *"
PBKDF2_ITER = "10000"
SITE_URL = "https://saydaliti-staging.saydalitiapp.workers.dev"
# The test suites create many accounts.
SIGNUP_PER_HOUR = "10000"
SEAL_BUDGET = "150"
VERIFY_MAX_ROWS = "200"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "saydaliti-staging"
database_id = "0ba7c0dd-645e-453e-9999-a316a828e175"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "FILES"
bucket_name = "saydaliti-files-staging"

[env.staging.triggers]
# Only the backup job on staging (no WhatsApp jobs).
crons = ["*/30 * * * *"]

[env.staging.observability]
enabled = true
