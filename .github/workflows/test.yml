# Runs the calculation tests and the browser test on every pull request and on main,
# so a mistake shows up before it is merged.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Calculation tests
        run: npm test
      - name: Browser for the dashboard test
        run: npx playwright install --with-deps chromium
      - name: Dashboard test (sign-in, branches, expenses, offline, phone size)
        # A failing test is also shown as an annotation on the run (readable without the full log).
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee e2e.log || { grep -A12 '^not ok' e2e.log | tr '\n' ' ' | sed 's/not ok/\n::error::not ok/g'; echo; exit 1; }
      - name: Cloudflare server on this machine (D1 and R2 kept locally)
        working-directory: worker
        run: |
          npm ci
          npm run build
          printf 'PIN_PEPPER=ci-pepper\nSIGNUP_PER_HOUR=10000\n' > .dev.vars
          npx wrangler d1 migrations apply saydaliti --local
          nohup npx wrangler dev --local --port 8787 > ../wrangler.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8787/api/config && curl -sf -o /dev/null http://localhost:8787/ && exit 0; sleep 1; done
          cat ../wrangler.log; exit 1
      - name: Cloudflare server rules and the whole app on it
        env:
          WORKER_URL: http://localhost:8787
        run: node --test worker/test/api.test.mjs e2e/cloudflare.e2e.mjs

  # The live sync with United on a real SQL Server, read by Windows PowerShell like on the pharmacy PC.
  united-sync:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: SQL Server
        uses: potatoqualitee/mssqlsuite@v2
        with:
          install: sqlengine
          version: 2019
      - name: A small United (Genius) database
        shell: powershell
        run: .github/scripts/genius-test-db.ps1
      - name: Find it and read it (Windows sign-in, then a SQL login)
        shell: powershell
        run: |
          $s = 'desktop/genius-live.ps1'
          $from = (Get-Date).AddDays(-365).ToString('yyyyMMdd')
          powershell -NoProfile -ExecutionPolicy Bypass -File $s -Find -Out find.txt
          if ($LASTEXITCODE) { Get-Content find.txt.err; exit 1 }
          Get-Content find.txt
          powershell -NoProfile -ExecutionPolicy Bypass -File $s -Server localhost -Database GeniusTest -From $from -Out read.txt
          if ($LASTEXITCODE) { Get-Content read.txt.err; exit 1 }
          $env:SAYDALITI_SQL_PASSWORD = 'dbatools.I0'
          powershell -NoProfile -ExecutionPolicy Bypass -File $s -Server localhost -Database GeniusTest -User sa -From $from -Out read-sa.txt
          if ($LASTEXITCODE) { Get-Content read-sa.txt.err; exit 1 }
          $env:SAYDALITI_SQL_PASSWORD = 'wrong'
          powershell -NoProfile -ExecutionPolicy Bypass -File $s -Server localhost -Database GeniusTest -User sa -From $from -Out bad.txt
          if (-not $LASTEXITCODE -or -not (Get-Content bad.txt.err | Select-String 'Login failed')) { 'a wrong password must fail with Login failed'; exit 1 }
          exit 0
      - name: The rows give the expected items, stock and sales
        run: node .github/scripts/genius-live-check.mjs find.txt read.txt read-sa.txt
