# Builds the Windows program (desktop/) — online with the pharmacy's account, or offline with the data on
# the computer —
# and publishes the installer on the "desktop-latest" release:
#   https://github.com/bodamansour/saydaliti/releases/tag/desktop-latest
name: Windows program

on:
  push:
    branches: [main]
    paths: ['src/**', '*.html', 'icons/**', 'desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['src/**', '*.html', 'icons/**', 'desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Version
        run: npm pkg set version=1.0.${{ github.run_number }}
      - name: Build the installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Check it starts online and offline, works with no internet, and keeps its data
        run: node smoke.mjs
      - name: Keep the installer (pull request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: saydaliti-setup
          path: desktop/dist/TablixPharma-Setup.exe
      - name: Publish on the desktop-latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (v2.6.2)
        with:
          tag_name: desktop-latest
          name: Tablix Pharma — برنامج الكمبيوتر
          body: |
            نزّل `TablixPharma-Setup.exe` على كمبيوتر الصيدلية وافتحه عشان يتسطب (ويندوز 10 و11، 64 بت).
            ويندوز 7 و8 و32 بت مش مدعومين: النسخة القديمة `Saydaliti-Setup-Win7.exe` (لو لسه موجودة هنا) مبنية على Electron 22 اللي مبقاش بياخد تحديثات أمان، ومش بتتحدّث تاني. استخدم ويندوز 10 أو 11 (64 بت)، أو افتح الموقع من متصفح حديث مدعوم.
            لو ويندوز قال «Windows protected your PC»، دوس More info ثم Run anyway (البرنامج مش موقّع بشهادة مدفوعة).
            أول مرة بيسأل: أونلاين بحسابك (نفس بيانات الموبايل والموقع)، ولا على الجهاز ده بس من غير نت (نسخة احتياطية كل يوم في Documents\Saydaliti\backups).
            التحديث: نزّل الملف الجديد وسطّبه فوق القديم، والبيانات بتفضل زي ما هي.
            الإصدار: 1.0.${{ github.run_number }}
          files: desktop/dist/TablixPharma-Setup.exe
          make_latest: false

# Windows 7/8 and 32-bit Windows are not supported (owner decision, 2026-11-03): the only Electron
# that still runs there (22.x) is end-of-life and gets no security fixes, so no installer is built for it.
# An older Saydaliti-Setup-Win7.exe may still be attached to the desktop-latest release; it is kept as
# a legacy file only and is not a supported or patched release.
