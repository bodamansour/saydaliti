# Builds the Windows program (desktop/) — online with the pharmacy's account, or offline with the data on
# the computer —
# and publishes the installer on the "desktop-latest" release:
#   https://github.com/bodamansour/saydaliti/releases/tag/desktop-latest
name: Windows program

on:
  push:
    branches: [main]
    paths: ['src/**', '*.html', 'icons/**', 'desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['src/**', '*.html', 'icons/**', 'desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Version
        run: npm pkg set version=1.0.${{ github.run_number }}
      - name: Build the installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Check it starts online and offline, works with no internet, and keeps its data
        run: node smoke.mjs
      - name: Keep the installer (pull request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: saydaliti-setup
          path: desktop/dist/Saydaliti-Setup.exe
      - name: Publish on the desktop-latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: صيدليتي — برنامج الكمبيوتر (من غير نت)
          body: |
            نزّل `Saydaliti-Setup.exe` على كمبيوتر الصيدلية وافتحه عشان يتسطب.
            لو ويندوز قال «Windows protected your PC»، دوس More info ثم Run anyway (البرنامج مش موقّع بشهادة مدفوعة).
            البرنامج بيشتغل من غير نت خالص، والبيانات بتتحفظ على الجهاز، ونسخة احتياطية كل يوم في Documents\Saydaliti\backups.
            التحديث: نزّل الملف الجديد وسطّبه فوق القديم، والبيانات بتفضل زي ما هي.
            الإصدار: 1.0.${{ github.run_number }}
          files: desktop/dist/Saydaliti-Setup.exe
          make_latest: false
