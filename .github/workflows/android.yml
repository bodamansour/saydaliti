# Builds the Android app (mobile/) and publishes the APK on the "android-latest" release, so it can be
# downloaded straight to a phone from:
#   https://github.com/bodamansour/tablix-pharma/releases/tag/android-latest
# Before that it checks the app's numbers are the website's: the website's calculations (the src/*.js files
# listed below) are worked out again in Dart in mobile/lib/logic, and mobile/test/parity_test.dart compares them.
name: Android app

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml', 'src/core.js', 'src/inventory.js', 'src/insights.js', 'src/treasury.js', 'src/ordering.js', 'src/branches-expenses.js']
  pull_request:
    paths: ['mobile/**', '.github/workflows/android.yml', 'src/core.js', 'src/inventory.js', 'src/insights.js', 'src/treasury.js', 'src/ordering.js', 'src/branches-expenses.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2 (v2.23.0)
        with:
          channel: stable
          cache: true

      # The Android project files are generated here instead of being kept in the repo.
      - name: Create the Android project
        run: |
          flutter create --platforms=android --org com.saydaliti --project-name saydaliti_app .
          rm -f test/widget_test.dart # the template's sample test, not this app's

      - name: App name, internet access, versions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Tablix Pharma"/' "$M"
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          # The camera reads barcodes (quick count, receiving). Asked for the first time it is used.
          grep -q 'android.permission.CAMERA' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application#' "$M"
          G=$(ls android/app/build.gradle* | head -1)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' "$G"
          # The release lint pass crashes inside the lint tool itself on a plugin's Java file
          # (url_launcher_android, NoSuchMethodError in JavaDocParser). It checks nothing of ours, so it is off.
          B=$(ls android/build.gradle* | head -1)
          printf '\nsubprojects {\n    tasks.matching { it.name.startsWith("lintVital") }.configureEach { enabled = false }\n}\n' >> "$B"
          echo "--- manifest"; head -20 "$M"

      - name: Get packages
        run: |
          flutter pub get
          awk '/^  [a-z_]+:$/{p=$1} /^    version:/{ if (p ~ /^(http|intl|shared_preferences|path_provider|url_launcher|mobile_scanner):$/) print "::notice::" p " " $2 }' pubspec.lock
      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # The same pharmacy worked out by the website's code and by the app's: every number must match.
      # In Cairo time, like the pharmacies (a time zone with daylight saving catches date mistakes).
      - name: The app's numbers are the website's
        env:
          TZ: Africa/Cairo
        run: |
          node test/parity/make_expected.mjs
          flutter test
      - name: App icon
        run: dart run flutter_launcher_icons
      - name: Build APK
        run: |
          flutter --version | head -1 | sed 's/^/::notice::/'
          set +e
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=2.0.${{ github.run_number }} --dart-define=SITE_URL=https://tablix.tablixpharma.workers.dev 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Surface the reason as annotations (readable on the run page and through the API).
            grep -iE "error|what went wrong|failed|exception|> " build.log | grep -v "^\s*$" | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $code
      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-release.apk ../tablix-pharma.apk

      # Android installs an update over the old app only when both are signed with the same key.
      # The key comes from three repository secrets (see README, "مفتاح توقيع أبلكيشن أندرويد").
      # Without them every build gets a throwaway key, so each update needs an uninstall first.
      - name: Sign with the app key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::warning::No app signing key in the repository secrets yet, so this APK will not install over an older version (uninstall first). See README."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/app.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/app.jks" --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --out ../signed.apk ../tablix-pharma.apk
          rm -f "$RUNNER_TEMP/app.jks"
          mv ../signed.apk ../tablix-pharma.apk
          "$BT/apksigner" verify ../tablix-pharma.apk && echo "::notice::Signed with the app key."

      # On a pull request the APK is only kept as a build file, to check that it builds.
      - name: Keep the APK (pull request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: saydaliti-apk
          path: tablix-pharma.apk

      - name: Publish on the android-latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (v2.6.2)
        with:
          tag_name: android-latest
          name: Tablix Pharma — أبلكيشن أندرويد
          body: |
            نزّل `tablix-pharma.apk` على الموبايل وافتحه عشان يتسطب.
            لو الموبايل سأل، اسمح بتسطيب التطبيقات من المتصفح أو مدير الملفات.
            الإصدار: 2.0.${{ github.run_number }}
          files: tablix-pharma.apk
          make_latest: true
