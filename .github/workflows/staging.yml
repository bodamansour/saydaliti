# STAGING validation on Cloudflare (isolated; synthetic data only). Never touches production:
#   - job `preflight` has NO secrets: isolation tests + the wrangler.toml guard (worker/scripts/staging-guard.mjs),
#   - job `deploy` runs only after it, only in the protected GitHub environment `staging` (required reviewer),
#     only for the repository owner, only from the working branch or main, and only with the staging token
#     (CLOUDFLARE_STAGING_API_TOKEN — there is no fallback to the production CLOUDFLARE_API_TOKEN),
#   - before any write, `staging-guard.mjs remote` proves (read-only) that the token's account holds the staging
#     D1 and R2; every wrangler call then goes through `staging-guard.mjs run`, which adds --env staging,
#     allows only listed commands, refuses production names/ids, and refuses writes without that proof.
# The deploy job runs only from a manual run (Actions → Run workflow, typing STAGING). A push of
# .github/staging-run runs the credential-free preflight only. Never triggered by pull requests,
# schedules or other workflows. Docs: docs/deployment/STAGING.md.
name: Cloudflare staging validation

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type STAGING to deploy the current commit to the isolated staging environment'
        required: true
  push:
    branches: [ccr-94719aa6-7k3i5e]
    paths: ['.github/staging-run']

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Explicit request
        env:
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$CONFIRM" != "STAGING" ]; then
            echo "::error::type STAGING to run the staging deployment"; exit 1
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Isolation tests and the wrangler.toml guard
        run: |
          node --test test/staging-isolation.test.js test/staging-guard.test.js
          node worker/scripts/staging-guard.mjs config

  deploy:
    name: Staging deploy and validation
    needs: preflight
    # Manual runs only (a push of the request file runs the preflight alone). Owner only, from the working
    # branch or main; never a pull request (no such trigger above either).
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && (github.ref == 'refs/heads/ccr-94719aa6-7k3i5e' || github.ref == 'refs/heads/main')
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_STAGING_TOKEN_SOURCE: CLOUDFLARE_STAGING_API_TOKEN
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      STAGING_BACKUP_KEY: ${{ secrets.STAGING_BACKUP_KEY }}
      GUARD: node scripts/staging-guard.mjs
    steps:
      - name: Staging settings are present (names only, values never printed)
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secret:CLOUDFLARE_STAGING_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing variable:CLOUDFLARE_STAGING_ACCOUNT_ID"
          [ -n "$STAGING_BACKUP_KEY" ] || missing="$missing secret:STAGING_BACKUP_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing (see docs/deployment/STAGING.md)"; exit 1; fi
          if [ ${#STAGING_BACKUP_KEY} -lt 32 ]; then echo "::error::STAGING_BACKUP_KEY must be at least 32 characters"; exit 1; fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the Worker tools
        working-directory: worker
        run: npm ci
      - name: Guard — wrangler.toml, then (read-only) the token's account holds the staging D1 and R2
        working-directory: worker
        run: $GUARD remote
      - name: Migrations on the staging database
        working-directory: worker
        run: |
          $GUARD run -- d1 migrations list DB --remote
          $GUARD run -- d1 migrations apply DB --remote
      - name: Deploy the staging Worker
        working-directory: worker
        run: |
          npm run build
          $GUARD run -- deploy | tee deploy.log
          url=$(grep -oE 'https://saydaliti-staging\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::no staging URL in the deploy output"; exit 1; }
          echo "STAGING_URL=$url" >> "$GITHUB_ENV"
          echo "::notice::staging URL $url"
      - name: Staging secrets on the Worker (BACKUP_KEY from the GitHub secret; PIN_PEPPER random, staging only)
        working-directory: worker
        run: |
          printf '%s' "$STAGING_BACKUP_KEY" | $GUARD run -- secret put BACKUP_KEY >/dev/null
          $GUARD run -- secret list --format json > names.json
          if ! node -e "process.exit(JSON.parse(require('fs').readFileSync('names.json','utf8')).some(s=>s.name==='PIN_PEPPER')?0:1)"; then
            openssl rand -hex 32 | tr -d '\n' | $GUARD run -- secret put PIN_PEPPER >/dev/null
          fi
          node -e "console.log('staging secret names:', JSON.parse(require('fs').readFileSync('names.json','utf8')).map(s=>s.name).join(', '))"
          rm -f names.json
      - name: The staging Worker answers
        run: for i in $(seq 1 40); do curl -sf "$STAGING_URL/api/config" && exit 0; sleep 3; done; exit 1
      - name: Real D1 — applied migrations in order, the stock trigger and tables exist, nothing pending
        working-directory: worker
        run: |
          $GUARD run -- d1 execute DB --remote --command "SELECT id, name, applied_at FROM d1_migrations ORDER BY id"
          $GUARD run -- d1 execute DB --remote --command "SELECT type, name FROM sqlite_master WHERE (type = 'trigger') OR (type = 'table' AND (name LIKE 'stock_%' OR name IN ('backups', 'return_approvals'))) ORDER BY type, name"
          $GUARD run -- d1 migrations list DB --remote
      - name: Cloudflare — the staging Worker's cron schedules (read-only)
        working-directory: worker
        run: $GUARD schedules
      - name: Browser for the UI tests
        run: npx playwright install --with-deps chromium
      - name: Test suites against the staging Worker (synthetic accounts and data)
        env:
          WORKER_URL: ${{ env.STAGING_URL }}
        run: node --test worker/test/api.test.mjs worker/test/stock.test.mjs worker/test/backup.test.mjs e2e/cloudflare.e2e.mjs e2e/offline-sync.e2e.mjs 2>&1 | tee staging-tests.log; exit ${PIPESTATUS[0]}
      - name: Backup on Cloudflare — make, download from R2, open, refuse wrong key/pharmacy/changed byte, restore, verify
        if: always() && env.STAGING_URL != ''
        working-directory: worker
        run: node scripts/staging-backup-check.mjs 300 ../staging-backup-report.json
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-reports
          path: |
            staging-backup-report.json
            staging-tests.log
          if-no-files-found: ignore
