# STAGING validation on Cloudflare (isolated; synthetic data only). Never touches production:
#   - staging-only credentials (CLOUDFLARE_STAGING_API_TOKEN / CLOUDFLARE_STAGING_ACCOUNT_ID),
#   - every remote command uses --env staging (Worker saydaliti-staging, D1 saydaliti-staging,
#     R2 saydaliti-files-staging) — checked by test/staging-isolation.test.js before anything runs,
#   - the staging BACKUP_KEY comes from the STAGING_BACKUP_KEY secret and is never printed.
# Runs by hand (Actions → Cloudflare staging validation), or when .github/staging-run changes on the
# working branch. Docs: docs/deployment/STAGING.md.
name: Cloudflare staging validation

on:
  workflow_dispatch:
  push:
    branches: [ccr-94719aa6-7k3i5e]
    paths: ['.github/staging-run']

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      STAGING_BACKUP_KEY: ${{ secrets.STAGING_BACKUP_KEY }}
    steps:
      - name: Staging secrets are set (values never printed)
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_STAGING_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_STAGING_ACCOUNT_ID"
          [ -n "$STAGING_BACKUP_KEY" ] || missing="$missing STAGING_BACKUP_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secrets:$missing (see docs/deployment/STAGING.md)"; exit 1; fi
          if [ ${#STAGING_BACKUP_KEY} -lt 32 ]; then echo "::error::STAGING_BACKUP_KEY must be at least 32 characters"; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Isolation checks (staging can't bind to production)
        run: node --test test/staging-isolation.test.js
      - name: Install the Worker tools
        working-directory: worker
        run: npm ci
      - name: Account and staging database (ids only)
        working-directory: worker
        run: |
          npx wrangler whoami --env staging 2>&1 | grep -iE "account|email" | sed -E 's/[A-Za-z0-9._%+-]+@/***@/' || true
          npx wrangler d1 info DB --env staging --json | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log('staging D1:', j.name, j.uuid); if (j.uuid !== '0ba7c0dd-645e-453e-9999-a316a828e175') { console.log('::error::not the staging database'); process.exit(1) }"
      - name: Migrations on the staging database
        working-directory: worker
        run: |
          npx wrangler d1 migrations list DB --env staging --remote
          npx wrangler d1 migrations apply DB --env staging --remote
      - name: Deploy the staging Worker
        working-directory: worker
        run: |
          npm run build
          npx wrangler deploy --env staging | tee deploy.log
          url=$(grep -oE 'https://saydaliti-staging\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::no staging URL in the deploy output"; exit 1; }
          echo "STAGING_URL=$url" >> "$GITHUB_ENV"
          echo "::notice::staging URL $url"
      - name: Staging secrets on the Worker (BACKUP_KEY from the GitHub secret; PIN_PEPPER random, staging only)
        working-directory: worker
        run: |
          printf '%s' "$STAGING_BACKUP_KEY" | npx wrangler secret put BACKUP_KEY --env staging >/dev/null
          npx wrangler secret list --env staging --format json > names.json
          if ! node -e "process.exit(JSON.parse(require('fs').readFileSync('names.json','utf8')).some(s=>s.name==='PIN_PEPPER')?0:1)"; then
            openssl rand -hex 32 | tr -d '\n' | npx wrangler secret put PIN_PEPPER --env staging >/dev/null
          fi
          node -e "console.log('staging secret names:', JSON.parse(require('fs').readFileSync('names.json','utf8')).map(s=>s.name).join(', '))"
          rm -f names.json
      - name: The staging Worker answers
        run: for i in $(seq 1 40); do curl -sf "$STAGING_URL/api/config" && exit 0; sleep 3; done; exit 1
      - name: Real D1 — the stock trigger exists, nothing pending, crons registered
        working-directory: worker
        run: |
          npx wrangler d1 execute DB --env staging --remote --command "SELECT type, name FROM sqlite_master WHERE type IN ('trigger','table') AND name LIKE 'stock_%' OR name = 'backups' OR name = 'return_approvals' ORDER BY name"
          npx wrangler d1 migrations list DB --env staging --remote
      - name: Browser for the UI tests
        run: npx playwright install --with-deps chromium
      - name: Test suites against the staging Worker (synthetic accounts and data)
        env:
          WORKER_URL: ${{ env.STAGING_URL }}
        run: node --test worker/test/api.test.mjs worker/test/stock.test.mjs worker/test/backup.test.mjs e2e/cloudflare.e2e.mjs e2e/offline-sync.e2e.mjs 2>&1 | tee staging-tests.log; exit ${PIPESTATUS[0]}
      - name: Backup on Cloudflare — make, download from R2, open, refuse wrong key/pharmacy/changed byte, restore, verify
        if: always() && env.STAGING_URL != ''
        working-directory: worker
        run: node scripts/staging-backup-check.mjs 300 ../staging-backup-report.json
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-reports
          path: |
            staging-backup-report.json
            staging-tests.log
          if-no-files-found: ignore
